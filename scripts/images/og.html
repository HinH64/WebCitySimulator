<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<!-- Share preview (1200×630). Regenerate with: npm run images -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    background: #f4f5f7;
    color: #1f2328;
    font-family: 'Microsoft JhengHei', 'PingFang HK', 'Noto Sans TC', sans-serif;
    display: grid;
    grid-template-columns: 1fr 420px;
    align-items: center;
    gap: 40px;
    padding: 0 72px;
    box-sizing: border-box;
  }
  .eyebrow { font-size: 26px; color: #59636e; margin: 0 0 12px; }
  h1 { font-size: 92px; line-height: 1.05; margin: 0; font-weight: 700; }
  .years { font-size: 52px; color: #1f66d1; font-weight: 700; margin: 8px 0 28px; }
  .tag { font-size: 28px; line-height: 1.5; color: #1f2328; margin: 0; }
  .card { background: #fff; border: 1px solid #d8dce1; border-radius: 8px; padding: 24px 24px 16px; }
  .card h2 { font-size: 24px; margin: 0 0 8px; font-weight: 700; }
  .legend { display: flex; gap: 24px; font-size: 20px; color: #59636e; margin-top: 8px; }
  .legend span::before { content: ''; display: inline-block; width: 28px; height: 4px; margin-right: 8px; vertical-align: middle; background: currentColor; }
  .yours { color: #1f66d1; }
  .real { color: #1f2328; }
</style>
</head>
<body>
  <div>
    <p class="eyebrow">網頁城市模擬遊戲</p>
    <h1>平行香港</h1>
    <div class="years">1997–2026</div>
    <p class="tag">從 1997 年 7 月 1 日的真實香港開始，<br />分配撥款、面對歷史關口。<br />你的 2026 年，會跟真實的香港有多大分別？</p>
  </div>
  <div class="card">
    <h2>安居</h2>
    <svg viewBox="0 0 420 262" width="370" height="231" aria-hidden="true">
      <g stroke="#d8dce1" stroke-width="1">
        <line x1="0" y1="20" x2="420" y2="20" /><line x1="0" y1="120" x2="420" y2="120" /><line x1="0" y1="220" x2="420" y2="220" />
      </g>
      <polyline fill="none" stroke="#1f2328" stroke-width="4" stroke-linejoin="round"
        points="0,170 40,150 80,120 120,95 160,92 200,110 240,140 280,165 320,175 360,160 420,150" />
      <polyline fill="none" stroke="#1f66d1" stroke-width="4" stroke-linejoin="round"
        points="0,170 40,150 80,118 120,90 160,78 200,70 240,66 280,62 320,58 360,52 420,48" />
      <g fill="#59636e" font-size="18" font-family="Microsoft JhengHei, sans-serif">
        <text x="0" y="252">1997</text><text x="420" y="252" text-anchor="end">2026</text>
      </g>
    </svg>
    <div class="legend"><span class="yours">你的香港</span><span class="real">真實香港</span></div>
  </div>
</body>
</html>
